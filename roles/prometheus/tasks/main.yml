
- name: Download Promotheus Node Exporter to Windows Temp
  win_get_url:
    url: https://github.com/prometheus-community/windows_exporter/releases/download/v0.17.1/windows_exporter-0.17.1-amd64.msi
    dest: c:\windows\temp\windows_exporter-0.17.1-amd64.msi

- name: Install Node Exporter
  win_package:
    path: c:\windows\temp\windows_exporter-0.17.1-amd64.msi
    state: present

- name: Register and start Prometheus service
  win_service:
    name: windows_exporter
    start_mode: delayed
    path: '"C:\Program Files\windows_exporter\windows_exporter.exe" --collectors.enabled="[defaults],process,time,memory" --log.format logger:eventlog?name=windows_exporter --telemetry.addr=":9100"'
    state: restarted

