---

- name: Set builder pool for Windows 2025
  set_fact: builder_pool="windows-x86_64"
  when: "'2025' in inventory_hostname"

- name: Set builder pool for Windows 2019
  set_fact: builder_pool="windows-1809-x86_64"
  when: "'2019' in inventory_hostname"

# The HCS backend now lives upstream: obuilder #204 (hcs2) and #209
# (hcs-container-cleanup), and ocluster #258. The old mtelvers/*/hcs2
# branches were deleted once those merged, so clone upstream master and
# take the obuilder submodule at the commit ocluster pins.
- name: Clone ocluster repo
  win_command: git clone --recursive https://github.com/ocurrent/ocluster c:\ocluster
  args:
    creates: c:\ocluster

- name: Ensure obuilder submodule is at the pinned commit
  win_shell: |
    cd c:\ocluster
    git submodule update --init --recursive

# ...but ocluster's pin is itself stale: the gitlink has been 0ad23d4 since
# 11 Aug 2026, so the step above checks out a three-month-old obuilder with
# no HCS ctr retry (obuilder #224). Without it, concurrent `ctr` calls hit
# "All pipe instances are busy", the caller reads a recoverable blip as
# success, and the active snapshot is orphaned.
#
# `branch = master` in ocluster's .gitmodules does not help - it is only
# consulted by `git submodule update --remote`, which we do not want either,
# since that would put every future obuilder commit on the farm untested.
# So pin explicitly. Note this does not force a rebuild on a re-run: the
# dune task below is guarded by `creates:`, so an existing worker needs its
# service stopped and worker.exe removed to pick up a changed pin.
- name: Pin obuilder to a commit with the HCS ctr retry
  win_shell: |
    cd c:\ocluster\obuilder
    if ((git rev-parse HEAD | Out-String).Trim() -ne "{{ obuilder_commit }}") {
      git fetch https://github.com/ocurrent/obuilder.git master
      git checkout --force --detach {{ obuilder_commit }}
      Write-Output "PINNED"
    }
  register: obuilder_pin_result
  changed_when: "'PINNED' in obuilder_pin_result.stdout"

- name: Create opam switch for ocluster
  win_command: opam switch create . 4.14.2 --no-install -y
  args:
    chdir: c:\ocluster
    creates: c:\ocluster\_opam

- name: Pin lwt to windows-fixes branch
  win_command: opam exec -- opam pin add lwt git+https://github.com/mtelvers/lwt.git#windows-fixes-v3 --no-action -y
  args:
    chdir: c:\ocluster

- name: Install ocluster dependencies
  win_command: opam exec -- opam install . --deps-only -y
  args:
    chdir: c:\ocluster

- name: Build ocluster-worker with dune
  win_command: opam exec -- dune build bin/worker.exe
  args:
    chdir: c:\ocluster
    creates: c:\ocluster\_build\default\bin\worker.exe

- name: Add mingw bin to system PATH for service runtime
  win_path:
    elements:
      - c:\users\administrator\appdata\local\opam\.cygwin\root\usr\x86_64-w64-mingw32\sys-root\mingw\bin
    scope: machine

- name: Create obuilder store directory
  win_file:
    path: C:\obuilder
    state: directory

- name: Copy capability file
  win_copy:
    src: secrets/pool-{{ builder_pool }}.cap
    dest: c:\windows\pool-{{ builder_pool }}.cap

- name: Remove old ocluster-worker service if present
  win_command: opam exec -- _build\default\bin\worker.exe remove {{ inventory_hostname_short | lower }}
  args:
    chdir: c:\ocluster
  failed_when: false

- name: Install ocluster-worker as a Windows service
  win_command: >
    opam exec -- _build\default\bin\worker.exe install
    --state-dir=c:\state
    --name={{ inventory_hostname_short | lower }}
    --capacity=4
    --prune-threshold=10
    --allow-push=ocurrent/opam-staging
    --connect=c:\windows\pool-{{ builder_pool }}.cap
    --obuilder-store=hcs:C:\obuilder
    --verbosity=info
  args:
    chdir: c:\ocluster

- name: Write go.bat for manual worker startup
  win_copy:
    content: |
      powershell -ExecutionPolicy Bypass -File c:\windows\fix-nat.ps1
      cd /d c:\ocluster
      opam exec -- _build\default\bin\worker.exe --verbosity=info --name={{ inventory_hostname_short | lower }} --connect=c:\windows\pool-{{ builder_pool }}.cap --capacity=4 --prune-threshold=10 --allow-push=ocurrent/opam-staging --state-dir=c:\state --obuilder-store=hcs:C:\obuilder
    dest: c:\windows\go.bat

- name: Start ocluster-worker service
  win_service:
    name: "{{ inventory_hostname_short | lower }}"
    state: started
