---

- name: Set builder pool for Windows 2025
  set_fact: builder_pool="windows-x86_64"
  when: "'2025' in inventory_hostname"

- name: Set builder pool for Windows 2019
  set_fact: builder_pool="windows-1809-x86_64"
  when: "'2019' in inventory_hostname"

- name: Clone ocluster repo
  win_command: git clone --recursive -b hcs2 https://github.com/mtelvers/ocluster c:\ocluster
  args:
    creates: c:\ocluster

- name: Update obuilder submodule to hcs2 branch
  win_shell: |
    cd c:\ocluster\obuilder
    git remote add mtelvers https://github.com/mtelvers/obuilder.git 2>$null
    git fetch mtelvers hcs2
    git checkout -f mtelvers/hcs2

- name: Create opam switch for ocluster
  win_command: opam switch create . 4.14.2 --no-install -y
  args:
    chdir: c:\ocluster
    creates: c:\ocluster\_opam

- name: Pin lwt to windows-fixes branch
  win_command: opam exec -- opam pin add lwt git+https://github.com/mtelvers/lwt.git#windows-fixes-v2 --no-action -y
  args:
    chdir: c:\ocluster

- name: Install ocluster dependencies
  win_command: opam exec -- opam install . --deps-only -y
  args:
    chdir: c:\ocluster

- name: Build ocluster-worker with dune
  win_command: opam exec -- dune build bin/worker.exe
  args:
    chdir: c:\ocluster
    creates: c:\ocluster\_build\default\bin\worker.exe

- name: Add mingw bin to system PATH for service runtime
  win_path:
    elements:
      - c:\users\administrator\appdata\local\opam\.cygwin\root\usr\x86_64-w64-mingw32\sys-root\mingw\bin
    scope: machine

- name: Create obuilder store directory
  win_file:
    path: C:\obuilder
    state: directory

- name: Copy capability file
  win_copy:
    src: secrets/pool-{{ builder_pool }}.cap
    dest: c:\windows\pool-{{ builder_pool }}.cap

- name: Remove old ocluster-worker service if present
  win_command: opam exec -- _build\default\bin\worker.exe remove {{ inventory_hostname_short | lower }}
  args:
    chdir: c:\ocluster
  failed_when: false

- name: Install ocluster-worker as a Windows service
  win_command: >
    opam exec -- _build\default\bin\worker.exe install
    --state-dir=c:\state
    --name={{ inventory_hostname_short | lower }}
    --capacity=4
    --prune-threshold=10
    --allow-push=ocurrent/opam-staging
    --connect=c:\windows\pool-{{ builder_pool }}.cap
    --obuilder-store=hcs:C:\obuilder
    --verbosity=info
  args:
    chdir: c:\ocluster

- name: Write go.bat for manual worker startup
  win_copy:
    content: |
      powershell -ExecutionPolicy Bypass -File c:\windows\fix-nat.ps1
      cd /d c:\ocluster
      opam exec -- _build\default\bin\worker.exe --verbosity=info --name={{ inventory_hostname_short | lower }} --connect=c:\windows\pool-{{ builder_pool }}.cap --capacity=4 --prune-threshold=10 --allow-push=ocurrent/opam-staging --state-dir=c:\state --obuilder-store=hcs:C:\obuilder
    dest: c:\windows\go.bat

- name: Start ocluster-worker service
  win_service:
    name: "{{ inventory_hostname_short | lower }}"
    state: started
