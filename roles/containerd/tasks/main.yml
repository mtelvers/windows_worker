---

- name: Set container base image for Windows 2025
  set_fact:
    container_base_image: "mcr.microsoft.com/windows/servercore:ltsc2025"
  when: "'2025' in inventory_hostname"

- name: Set container base image for Windows 2019
  set_fact:
    container_base_image: "mcr.microsoft.com/windows/servercore:ltsc2019"
  when: "'2019' in inventory_hostname"

- name: Download containerd runtime installer
  win_get_url:
    url: https://raw.githubusercontent.com/microsoft/Windows-Containers/refs/heads/Main/helpful_tools/Install-ContainerdRuntime/install-containerd-runtime.ps1
    dest: c:\windows\temp\install-containerd-runtime.ps1

- name: Install containerd runtime
  win_shell: >
    powershell.exe -ExecutionPolicy Bypass -File c:\windows\temp\install-containerd-runtime.ps1
    -ContainerDVersion 2.1.3
    -WinCNIVersion 0.3.1
    -ExternalNetAdapter Ethernet
    -ContainerBaseImage {{ container_base_image }}
  args:
    creates: C:\Program Files\containerd\containerd.exe

- name: Create CNI conf directory
  win_file:
    path: C:\Program Files\containerd\cni\conf
    state: directory

- name: Download HNS PowerShell module
  win_get_url:
    url: https://raw.githubusercontent.com/microsoft/SDN/master/Kubernetes/windows/hns.psm1
    dest: c:\windows\hns.psm1

- name: Copy fix-nat.ps1 script
  win_copy:
    src: fix-nat.ps1
    dest: c:\windows\fix-nat.ps1

- name: Sync CNI config to Docker's NAT network subnet
  win_shell: powershell.exe -ExecutionPolicy Bypass -File c:\windows\fix-nat.ps1

- name: Create scheduled task to sync CNI config on boot
  win_shell: |
    $action = New-ScheduledTaskAction -Execute 'powershell.exe' -Argument '-ExecutionPolicy Bypass -File c:\windows\fix-nat.ps1'
    $trigger = New-ScheduledTaskTrigger -AtStartup
    $principal = New-ScheduledTaskPrincipal -UserId 'SYSTEM' -LogonType ServiceAccount -RunLevel Highest
    Register-ScheduledTask -TaskName 'SyncCniNatConfig' -Action $action -Trigger $trigger -Principal $principal -Force

- name: Ensure containerd service is running
  win_service:
    name: containerd
    start_mode: auto
    state: started
