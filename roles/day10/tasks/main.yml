---
# The day10 tool itself, built natively and put on the machine PATH, where
# the worker service (LocalSystem, no opam environment) finds it as "day10".
# It needs ctr, hcn-namespace and git on that PATH too: the containerd
# installer, the hcn-namespace role and the git role put them there. Its
# mingw runtime DLLs (libstdc++ for mccs) come from the mingw bin dir the
# day10-worker role adds.

# Two sources. With day10_src_tgz set, a `git archive --prefix=day10/`
# snapshot from the playbook dir is unpacked as C:\day10: the Windows
# backend navajo runs (4b625e1) is on a main that has not been pushed.
# Otherwise clone GitHub and pin day10_commit.
- name: Upload day10 source snapshot
  win_copy:
    src: "{{ day10_src_tgz }}"
    dest: c:\windows\temp\day10-src.tgz
  when: day10_src_tgz is defined

- name: Unpack day10 source snapshot
  win_shell: |
    tar xzf c:\windows\temp\day10-src.tgz -C c:\
  args:
    creates: c:\day10
  when: day10_src_tgz is defined

- name: Clone day10
  win_command: git clone https://github.com/mtelvers/day10 c:\day10
  args:
    creates: c:\day10
  when: day10_src_tgz is not defined

- name: Check out the pinned day10 commit
  win_shell: |
    cd c:\day10
    if ((git rev-parse HEAD | Out-String).Trim() -ne "{{ day10_commit }}") {
      git fetch origin
      git checkout --force --detach {{ day10_commit }}
      Write-Output "PINNED"
    }
  register: day10_pin_result
  changed_when: "'PINNED' in day10_pin_result.stdout"
  when: day10_src_tgz is not defined

# Interrupting day10 on Windows (files/day10-windows-interrupt.patch, until
# main has it):
# - Ctrl-Break, the one console event that can be sent to a single process
#   group, reaches day10's SIGINT handler. OCaml 4.14 mapped it in
#   caml_win32_signal; OCaml 5 still defines that but no longer calls it, so
#   Ctrl-Break killed day10 outright and skipped every finaliser.
# - A blocking ReadFile is not interrupted, so a pending signal fires at the
#   first safe point after it returns, often the top of a finaliser, before
#   anything is released. Os.spawn and Cleanup.with_resource now release again
#   when Fun.protect reports a finaliser cut short (Finally_raised); without it
#   the build log stayed open and the temp directory could not be removed.
- name: Upload the day10 interrupt patch
  win_copy:
    src: day10-windows-interrupt.patch
    dest: c:\day10\day10-windows-interrupt.patch

- name: Make day10 interruptible on Windows
  win_shell: |
    cd c:\day10
    if (git apply --check --reverse day10-windows-interrupt.patch 2>$null) { Write-Output "ALREADY" } else { git apply day10-windows-interrupt.patch; Write-Output "APPLIED" }
  register: day10_patch
  changed_when: "'APPLIED' in day10_patch.stdout"
  failed_when: day10_patch.rc != 0

- name: Create opam switch for day10
  win_command: opam switch create . {{ day10_ocaml }} --no-install -y
  args:
    chdir: c:\day10
    creates: c:\day10\_opam

- name: Install day10 dependencies
  win_command: opam exec -- opam install . --deps-only -y
  args:
    chdir: c:\day10

- name: Build day10
  win_command: opam exec -- dune build @install
  args:
    chdir: c:\day10
    creates: c:\day10\_build\install\default\bin\day10.exe

- name: Copy day10 to system32
  win_copy:
    src: c:\day10\_build\install\default\bin\day10.exe
    dest: c:\windows\system32\day10.exe
    remote_src: true
