# Both ocluster and day10 build on 5.3.0 like optiplex. day10 itself needs
# >= 5.3.0, which rules out the 4.14.2 the obuilder worker uses.
day10_ocaml: ocaml-base-compiler.5.3.0

# mtelvers/day10 main as of 2026-11-08: containers build on their own drive
# and copy layers out with robocopy, the base falls back to opam's archive
# cache, ctr is retried while containerd's pipe is busy, and a base that
# fails to build is no longer kept. Not on GitHub yet (origin/main is
# ad1a8f6), so navajo takes a snapshot: see day10_src_tgz in
# provision-navajo.sh.
day10_commit: 99de1635c598db454a668c9b1825453595fed709

