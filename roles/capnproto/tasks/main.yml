---

- name: Download capnproto
  win_get_url:
    url: https://capnproto.org/capnproto-c++-win32-1.0.2.zip
    dest: c:\windows\temp\capnproto-c++-win32-1.0.2.zip

- name: Extract capnproto
  win_command: powershell -command "Expand-Archive c:\windows\temp\capnproto-c++-win32-1.0.2.zip c:\windows\temp"
  args:
    creates: c:\windows\temp\capnproto-tools-win32-1.0.2

- name: Copy capnproto to system32
  win_copy:
    src: c:\windows\temp\capnproto-tools-win32-1.0.2\
    dest: c:\windows\system32
    remote_src: true
