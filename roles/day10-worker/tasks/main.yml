---
# ocluster-worker from the day10 branch, as a Windows service in the
# day10-windows-x86_64 pool. The service runs as LocalSystem with no opam
# environment, so everything it execs - day10, ctr, hcn-namespace, git and
# their DLLs - has to be on the machine PATH.

- name: Clone ocluster (day10 branch)
  win_command: git clone --recursive --branch day10 https://github.com/mtelvers/ocluster c:\ocluster
  args:
    creates: c:\ocluster

- name: Check out the pinned ocluster commit
  win_shell: |
    cd c:\ocluster
    if ((git rev-parse HEAD | Out-String).Trim() -ne "{{ ocluster_day10_commit }}") {
      git fetch origin day10
      git checkout --force --detach {{ ocluster_day10_commit }}
      git submodule update --init --recursive
      Write-Output "PINNED"
    }
  register: ocluster_pin_result
  changed_when: "'PINNED' in ocluster_pin_result.stdout"

# A Windows service has no console, so the worker's standard handles are not
# valid, and Process.exec copies its stdout to each child as stderr. day10
# then went away silently before its first container; the same binary with
# stdio redirected to a file ran. The patch (files/winsvc-stdio.patch) points
# the service's stdout and stderr at the worker log, which also keeps day10's
# stderr - where its real errors go - next to the worker's own messages.
# Drop this task once the day10 branch carries the change.
- name: Upload the service stdio patch
  win_copy:
    src: winsvc-stdio.patch
    dest: c:\ocluster\winsvc-stdio.patch

- name: Redirect the service's stdio to the worker log
  win_shell: |
    cd c:\ocluster
    if (git apply --ignore-whitespace --check --reverse winsvc-stdio.patch 2>$null) { Write-Output "ALREADY" } else { git apply --ignore-whitespace winsvc-stdio.patch; Write-Output "APPLIED" }
  register: stdio_patch
  changed_when: "'APPLIED' in stdio_patch.stdout"
  failed_when: stdio_patch.rc != 0

# Process.exec gave every child [`FD_copy Unix.stdout] as stderr. On Unix
# that lands in the job log by accident: Lwt applies redirections in the
# forked child in order, so fd 1 is already the log pipe when it is copied to
# fd 2. On Windows the handles are resolved in the parent, so it was the
# worker's own stdout, and day10's [NOTE] success / [ERROR] failure never
# reached the job log. The patch makes stderr share the stdout pipe by
# default on every platform. Applies on top of winsvc-stdio.patch.
- name: Upload the stderr patch
  win_copy:
    src: process-stderr-stdout.patch
    dest: c:\ocluster\process-stderr-stdout.patch

- name: Send children's stderr to the job log
  win_shell: |
    cd c:\ocluster
    if (git apply --ignore-whitespace --check --reverse process-stderr-stdout.patch 2>$null) { Write-Output "ALREADY" } else { git apply --ignore-whitespace process-stderr-stdout.patch; Write-Output "APPLIED" }
  register: stderr_patch
  changed_when: "'APPLIED' in stderr_patch.stdout"
  failed_when: stderr_patch.rc != 0

# On cancel, interrupt day10 and kill it only after the grace period, the
# same on every platform: SIGINT on Unix, Ctrl-C on the job's own console on
# Windows, sent by a helper (worker.exe console-interrupt) so the worker is
# never attached to it. Applies on top of process-stderr-stdout.patch. These
# three are commits c8db8e3, 8a9e0f0 and ed9d700 on mtelvers/ocluster's day10
# branch; drop them once ocluster_day10_commit moves past ed9d700.
- name: Upload the interrupt patch
  win_copy:
    src: worker-interrupt.patch
    dest: c:\ocluster\worker-interrupt.patch

- name: Interrupt rather than kill a cancelled job
  win_shell: |
    cd c:\ocluster
    if (git apply --ignore-whitespace --check --reverse worker-interrupt.patch 2>$null) { Write-Output "ALREADY" } else { git apply --ignore-whitespace worker-interrupt.patch; Write-Output "APPLIED" }
  register: interrupt_patch
  changed_when: "'APPLIED' in interrupt_patch.stdout"
  failed_when: interrupt_patch.rc != 0

- name: Create opam switch for ocluster
  win_command: opam switch create . {{ day10_ocaml }} --no-install -y
  args:
    chdir: c:\ocluster
    creates: c:\ocluster\_opam

# The same Lwt fixes the obuilder worker pins (roles/worker). Stock Lwt
# starts every child with bInheritHandles=TRUE, so one job's child can hold
# another job's output pipe open: a day10 job sat for good after its git step
# had exited. It also hangs on a failed connect, which is how the worker
# failed to reconnect after a scheduler restart. windows-fixes-v3 restricts
# inheritance to the child's own handles and reports the failed connect.
- name: Pin lwt to windows-fixes branch
  win_command: opam exec -- opam pin add lwt git+https://github.com/mtelvers/lwt.git#windows-fixes-v3 --no-action -y
  args:
    chdir: c:\ocluster

# The three packages, not ".": the directory also holds current_ocluster,
# whose ocurrent dependency tree is not needed for the worker. winsvc, which
# makes `worker.exe install` a real service, is a win32 dependency of
# ocluster.opam.
- name: Install ocluster dependencies
  win_command: opam exec -- opam install ./ocluster-api.opam ./ocluster-worker.opam ./ocluster.opam --deps-only -y
  args:
    chdir: c:\ocluster

- name: Build ocluster-worker with dune
  win_command: opam exec -- dune build bin/worker.exe
  args:
    chdir: c:\ocluster
    creates: c:\ocluster\_build\default\bin\worker.exe

- name: Add mingw bin to system PATH for service runtime
  win_path:
    elements:
      - c:\users\administrator\appdata\local\opam\.cygwin\root\usr\x86_64-w64-mingw32\sys-root\mingw\bin
    scope: machine

- name: Create day10 cache and state directories
  win_file:
    path: "{{ item }}"
    state: directory
  loop:
    - "{{ day10_cache_dir }}"
    - "{{ day10_state_dir }}"

- name: Copy capability file
  win_copy:
    src: secrets/pool-day10-windows-x86_64.cap
    dest: c:\windows\pool-day10-windows-x86_64.cap

- name: Remove old ocluster-worker service if present
  win_command: opam exec -- _build\default\bin\worker.exe remove {{ worker_name }}
  args:
    chdir: c:\ocluster
  failed_when: false

- name: Install ocluster-worker as a Windows service
  win_command: >
    opam exec -- _build\default\bin\worker.exe install
    --state-dir={{ day10_state_dir }}
    --name={{ worker_name }}
    --capacity={{ day10_capacity }}
    --day10-cache={{ day10_cache_dir }}
    --day10-prune-threshold={{ day10_prune_threshold }}
    --connect=c:\windows\pool-day10-windows-x86_64.cap
    --verbosity=info
  args:
    chdir: c:\ocluster

- name: Write go.bat for manual worker startup
  win_copy:
    content: |
      cd /d c:\ocluster
      opam exec -- _build\default\bin\worker.exe --verbosity=info --name={{ worker_name }} --connect=c:\windows\pool-day10-windows-x86_64.cap --capacity={{ day10_capacity }} --state-dir={{ day10_state_dir }} --day10-cache={{ day10_cache_dir }} --day10-prune-threshold={{ day10_prune_threshold }}
    dest: c:\windows\go.bat

# As Administrator, not LocalSystem as the obuilder worker runs. opam's
# Cygwin setup inside the container writes files with an explicit DACL
# (owner ContainerAdministrator, Administrators and Everyone read-only, no
# SYSTEM entry), and day10 then cannot delete or chmod them from the host:
# EACCES on installed.db at the end of the base build. Administrator can,
# as on optiplex where the worker always ran as Administrator. win_service
# grants the account the log-on-as-a-service right.
- name: Run the worker service as Administrator and start it
  win_service:
    name: "{{ worker_name }}"
    username: .\Administrator
    password: "{{ ansible_password }}"
    start_mode: auto
    state: started
