---
# mtelvers/ocluster branch day10: upstream ocluster plus a "day10" custom job
# kind, the --day10-* worker options and a Git mirror of opam-repository
# under the state dir. 1d7ca7e (2026-11-16) is what navajo runs: since 5dc6523
# it sends stdio/stderr to the logs, cancels through a Ctrl-C helper, strips
# the CRs ending job-log lines and prints arch/os in the dispatch summary.
ocluster_day10_commit: 1d7ca7ea41b4cfd8137e3dfca03c41b8ca68eb36

# Same switch compiler as the day10 role (whose defaults are not in scope
# here) so the two builds share opam's download cache.
day10_ocaml: ocaml-base-compiler.5.3.0

# The name the worker registers with the scheduler. `worker.exe install`
# also names the Windows service after it. Defaults to the VM's name; set it
# in host_vars when the pool should see something else (navajo's guest is
# ltsc2025-day10 but registers as navajo).
worker_name: "{{ inventory_hostname_short | lower }}"

# Jobs run at once. Each is one process container at a time, with OPAMJOBS
# at day10's default, so this scales with the guest's cores.
day10_capacity: 4

# D: is the autounattend's second volume. The cache holds every built layer
# and is what the prune threshold watches; the state dir holds the worker's
# opam-repository mirror and logs.
day10_cache_dir: 'D:\cache'
day10_state_dir: 'D:\ocluster-state'
day10_prune_threshold: 10
