---

- name: Download opam 2.5.0
  win_get_url:
    url: https://github.com/ocaml/opam/releases/download/2.5.0/opam-2.5.0-x86_64-windows.exe
    dest: c:\windows\system32\opam.exe

- name: Initialize opam (installs managed Cygwin)
  win_shell: opam init --bare -y
  args:
    creates: c:\Users\Administrator\AppData\Local\opam
