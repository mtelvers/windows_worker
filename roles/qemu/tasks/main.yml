---

# Catch a bad/missing vm_name here rather than three roles later. A name
# that does not carry the Windows version leaves builder_pool undefined in
# roles/worker, which fails long after Windows has been installed.
- name: Validate vm_name
  assert:
    that:
      - vms | length > 0
      - vms | map(attribute='name') | select('match', '^\s*$') | list | length == 0
      - vms | map(attribute='name') | reject('search', winver) | list | length == 0
    fail_msg: >-
      Every vms[].name must be non-empty and contain winver ({{ winver }}).
      Got {{ vms | map(attribute='name') | list }}.
      Set it with: make provision VMNAME=ltsc<winver>-N
    success_msg: "Building {{ vms | map(attribute='name') | list | join(', ') }} (winver {{ winver }})"

- name: Check if VirtIO ISO already exists
  stat:
    path: "{{ playbook_dir }}/virtio-win.ISO"
  register: virtio_iso

- name: Download VirtIO drivers
  get_url:
    url: "{{ virtio_win_url }}"
    dest: "{{ playbook_dir }}/virtio-win.ISO"
  when: not virtio_iso.stat.exists

- name: Template autounattend.xml
  template:
    src: autounattend.xml.j2
    dest: "{{ playbook_dir }}/autounattend.xml"

- name: Create unattend ISO
  command: mkisofs -o {{ playbook_dir }}/unattend.iso -r -J {{ playbook_dir }}/autounattend.xml
  args:
    creates: "{{ playbook_dir }}/unattend.iso"

# UEFI boot via OVMF, needed for a GPT disk: MBR cannot address beyond 2 TiB,
# which capped ltsc2025-3's 7.3 TB disk at a single 2 TiB C:. Each VM needs its
# own writable copy of the firmware variables.
- name: Create per-VM OVMF variables file
  copy:
    src: /usr/share/OVMF/OVMF_VARS_4M.fd
    dest: "{{ playbook_dir }}/OVMF_VARS-{{ item.name }}.fd"
    force: no
    mode: "0644"
  become: yes
  loop: "{{ vms }}"
  loop_control:
    label: "{{ item.name }}"
  when: uefi is defined

- name: Install Windows onto disk
  become: yes
  command: >
    {{ ('numactl --cpunodebind=' ~ item.numa_node ~ ' --preferred=' ~ item.numa_node) if item.numa_node is defined else '' }}
    qemu-system-x86_64
    -m {{ qemu_mem }} -smp {{ qemu_smp }}
    -machine accel=kvm,type={{ 'q35' if uefi is defined else 'pc' }} -cpu host
    {{ ('-drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd -drive if=pflash,format=raw,file=' ~ playbook_dir ~ '/OVMF_VARS-' ~ item.name ~ '.fd') if uefi is defined else '' }}
    -display none -vnc :{{ item.vnc_display }}
    -netdev user,id=net0 -device virtio-net,netdev=net0
    -drive file={{ item.disk }},format=raw,if=virtio,cache=none
    -drive file={{ playbook_dir }}/{{ iso_names[winver] }},media=cdrom
    -drive file={{ playbook_dir }}/unattend.iso,media=cdrom
    -drive file={{ playbook_dir }}/virtio-win.ISO,media=cdrom
  args:
    creates: "{{ playbook_dir }}/.windows-installed-{{ item.name }}"
  loop: "{{ vms }}"
  loop_control:
    label: "{{ item.name }}"

- name: Mark installation complete
  file:
    path: "{{ playbook_dir }}/.windows-installed-{{ item.name }}"
    state: touch
  loop: "{{ vms }}"
  loop_control:
    label: "{{ item.name }}"

# systemd, not `nohup qemu &`, and not run.sh. Three things follow from it
# that neither had: the VMs come back after a host reboot, qemu cannot open
# the disk before its device unit is ready, and a stop gives Windows an ACPI
# power button instead of killing it mid-write.
#
# systemd-escape rather than string-munging the path: the device unit for
# /dev/vg_basil/lv_vm1 is dev-vg_basil-lv_vm1.device, but a disk whose name
# contains a dash would need it written \x2d, and these names change.
- name: Resolve the systemd device unit for each VM disk
  command: systemd-escape -p --suffix=device {{ item.disk }}
  register: vm_device_units
  changed_when: false
  loop: "{{ vms }}"
  loop_control:
    label: "{{ item.name }}"

- name: Install the QMP powerdown helper
  copy:
    src: windows-vm-powerdown
    dest: /usr/local/sbin/windows-vm-powerdown
    mode: "0755"
  become: yes

- name: Install a systemd unit for each VM
  template:
    src: windows-vm.service.j2
    dest: /etc/systemd/system/windows-vm-{{ item.item.name }}.service
    mode: "0644"
  become: yes
  vars:
    vm: "{{ item.item }}"
    device_unit: "{{ item.stdout }}"
  loop: "{{ vm_device_units.results }}"
  loop_control:
    label: "{{ item.item.name }}"

# state: started, deliberately not restarted. A changed unit does not bounce
# a VM that is mid-build; restart it when you mean to.
- name: Enable and start each VM
  systemd_service:
    name: "windows-vm-{{ item.name }}"
    enabled: yes
    state: started
    daemon_reload: yes
  become: yes
  loop: "{{ vms }}"
  loop_control:
    label: "{{ item.name }}"

- name: Wait for WinRM to become available
  wait_for:
    host: 127.0.0.1
    port: "{{ item.winrm_port }}"
    timeout: 300
  loop: "{{ vms }}"
  loop_control:
    label: "{{ item.name }}"

- name: Wait for WinRM to be fully ready
  pause:
    seconds: 30

- name: Add Windows VM to inventory
  add_host:
    name: "{{ item.name }}"
    groups: workers
    ansible_host: 127.0.0.1
    ansible_port: "{{ item.winrm_port }}"
    ansible_user: administrator
    ansible_password: vagrant
    ansible_connection: winrm
    ansible_winrm_scheme: http
    ansible_winrm_server_cert_validation: ignore
    ansible_winrm_connection_timeout: 120
    ansible_winrm_operation_timeout_sec: 120
    ansible_winrm_read_timeout_sec: 120
  loop: "{{ vms }}"
  loop_control:
    label: "{{ item.name }}"
